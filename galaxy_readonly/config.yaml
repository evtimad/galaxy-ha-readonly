name: Galaxy 3-144 Read-only Gateway
version: "0.3.0"
slug: galaxy_3144_readonly
description: Read-only LAN event gateway and dashboard for Galaxy 3-144 with E080
url: https://github.com/YOUR_USERNAME/galaxy-ha-readonly
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-home
panel_title: Galaxy 3-144
homeassistant_api: true
hassio_api: true
hassio_role: default
host_network: true
options:
  panel_name: Galaxy 3-144 V5.00
  module_name: E080-08A
  listen_protocol: udp
  listen_port: 1002
  bind_address: 0.0.0.0
  allowed_sender: ""
  event_format: auto
  retain_events: 500
  log_raw_messages: false
schema:
  panel_name: str
  module_name: str
  listen_protocol: list(udp|tcp)
  listen_port: port
  bind_address: str
  allowed_sender: str?
  event_format: list(auto|sia_text|raw)
  retain_events: int(10,5000)
  log_raw_messages: bool
ports:
  1002/udp: null
  1002/tcp: null
ports_description:
  1002/udp: Optional E080 event input when UDP is selected
  1002/tcp: Optional E080 event input when TCP is selected
